name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .tool-versions
          cache: false
      - name: Build all platforms
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir dist
          for target in linux/amd64 darwin/arm64 darwin/amd64 windows/amd64; do
            os="${target%/*}" arch="${target#*/}" ext=""
            [ "$os" = windows ] && ext=.exe
            name="drivesync-$VERSION-$os-$arch"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "dist/$name/drivesync$ext" .
            cp README.md LICENSE "dist/$name/"
            if [ "$os" = windows ]; then
              (cd dist && zip -qr "$name.zip" "$name")
            else
              tar -C dist -czf "dist/$name.tar.gz" "$name"
            fi
          done
          cp "dist/drivesync-$VERSION-linux-amd64/drivesync" dist/drivesync
      - name: Vendor the desktop app's locked crates
        run: |
          cd gui
          cargo vendor --locked --versioned-dirs vendor > /dev/null
          tar -czf ../dist/gui-vendor.tar.gz vendor
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: |
            dist/drivesync
            dist/gui-vendor.tar.gz
            dist/*.tar.gz
            dist/*.zip

  flatpak:
    needs: build
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
          path: dist
      - name: Import signing key
        env:
          GPG_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
        run: |
          if [ -z "$GPG_KEY" ]; then
            echo "::warning::FLATPAK_GPG_PRIVATE_KEY is not set; the Flatpak repo is not signed or published"
            exit 0
          fi
          echo "$GPG_KEY" | gpg --batch --import
          echo "GPG_ARGS=--gpg-sign=$KEY_ID" >> "$GITHUB_ENV"
      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          chmod 755 dist/drivesync
          tar -C gui -xzf dist/gui-vendor.tar.gz
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-from=flathub --force-clean --disable-rofiles-fuse \
            --default-branch=stable --repo=repo $GPG_ARGS build flatpak/io.github.celso_alexandre.drivesync.yml
          flatpak build-bundle repo "drivesync-$VERSION.flatpak" io.github.celso_alexandre.drivesync stable \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Assemble Pages site
        if: env.GPG_ARGS != ''
        run: |
          flatpak build-update-repo --generate-static-deltas --prune $GPG_ARGS repo
          mkdir site
          mv repo site/repo
          key="$(base64 -w0 flatpak/drivesync.gpg)"
          sed "s|@GPGKEY@|$key|" flatpak/drivesync.flatpakrepo.in > site/drivesync.flatpakrepo
          sed "s|@GPGKEY@|$key|" flatpak/io.github.celso_alexandre.drivesync.flatpakref.in > site/io.github.celso_alexandre.drivesync.flatpakref
          cp flatpak/drivesync.asc site/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak
          path: "*.flatpak"
          compression-level: 0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: env.GPG_ARGS != ''
        with:
          path: site

  flatpak-test:
    needs: flatpak
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flatpak
      - name: Install like a user would
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive ./drivesync-*.flatpak
      - name: Version and sandbox self-test inside the Flatpak
        run: |
          flatpak run --command=drivesync io.github.celso_alexandre.drivesync version
          flatpak run --command=drivesync io.github.celso_alexandre.drivesync selftest-sandbox

  publish:
    needs: [build, flatpak, flatpak-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
    env:
      SIGNED: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{binaries,flatpak}"
          merge-multiple: true
      - name: Checksums and signature
        env:
          GPG_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          rm -f gui-vendor.tar.gz
          sha256sum *.tar.gz *.zip *.flatpak > SHA256SUMS
          if [ -n "$GPG_KEY" ]; then
            echo "$GPG_KEY" | gpg --batch --import
            gpg --batch --armor --detach-sign SHA256SUMS
          fi
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$VERSION" --prerelease \
            --notes "drivesync $VERSION. Very early software: keep a backup of your Drive. Unofficial, not affiliated with Google.

          Linux: the desktop app, through the Flatpak remote (see README) or the .flatpak file below.
          The macOS, Windows and linux-amd64 archives hold only the sync engine, for technical users; the desktop app for macOS and Windows is not ready yet.
          Verify downloads with SHA256SUMS and its signature (key: flatpak/drivesync.asc in the repo)." \
            *.tar.gz *.zip *.flatpak SHA256SUMS $(ls SHA256SUMS.asc 2>/dev/null)
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        if: env.SIGNED == 'true'
