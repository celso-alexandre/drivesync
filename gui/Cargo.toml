[package]
name = "drivesync-gui"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[[bin]]
name = "drivesync-gui"
path = "src/main.rs"

[dependencies]
cxx = "=1.0.205"
cxx-qt = "=0.10.0"
cxx-qt-lib = { version = "=0.10.0", default-features = false, features = ["qt_gui", "qt_qml", "qt_quickcontrols"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[build-dependencies]
cxx-qt-build = "=0.10.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
